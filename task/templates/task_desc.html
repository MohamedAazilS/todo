{% extends 'base.html' %}

{%block title%}
    <h2>{{task.name}}</h2>
{% endblock title%}

{% block content %}
    <div class="">
        {{task.priority}}
        {{task.status}}
    </div>
    <button><a style="text-decoration: none;" href="{% url 'task_list' %}">Back</a></button>
    <button><a style="text-decoration: none;" href="{% url 'delete' task.id %}">Delete</a></button>
    <button><a style="text-decoration: none;" href="{% url 'update' task.id %}">Update</a></button>
{% endblock content %}
